  - auditability

# ============================================================
# 大小写敏感关键词:这些短/常见词如果走默认大小写不敏感,
# 会被英文常用词大量误命中(timer/moment/uncertainty/spectral/scada 等
# 部分词较安全;rag/mcp/rul/phm/tsfm 这类全大写缩写最危险)
# ============================================================
case_sensitive_keywords:
  - RAG
  - MCP
  - RUL
  - PHM
  - TSFM
  - SCADA
  - MOMENT
  - Timer
  - Chronos
  - Sundial
  - uncertainty

# ============================================================
# 字段与限额
# ============================================================
search_fields: [title, summary]
max_items: 300

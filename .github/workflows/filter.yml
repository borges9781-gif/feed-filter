name: filter-feeds

on:
  schedule:
    - cron: "15 */6 * * *"   # 每 6 小时跑一次,错峰 15 分避开整点高峰
  workflow_dispatch:          # 改完 config 想立刻生效就手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      # 1) arXiv + IEEE + ScienceDirect (每次都跑, 主力增量)
      - name: Run RSS filter
        run: python filter.py

      # 2) OpenReview 主会 + workshop (偶发 429, 挂了不阻断其他源)
      - name: Run OpenReview fetcher
        run: python openreview_fetch.py
        env:
          OPENREVIEW_USERNAME: ${{ secrets.OPENREVIEW_USERNAME }}
          OPENREVIEW_PASSWORD: ${{ secrets.OPENREVIEW_PASSWORD }}
        continue-on-error: true

      # 3) ACL Anthology BibTeX (出版后才有数据, 平时多为 0, 挂了不阻断)
      - name: Run ACL Anthology fetcher
        run: python acl_fetch.py
        continue-on-error: true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
